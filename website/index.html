<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lampstand: every scripture on screen, the moment it's preached</title>
    <meta name="description" content="Free, open-source church presentation software that listens to the sermon and puts every scripture on the projector by itself. Runs offline on Windows." />
    <meta property="og:title" content="Lampstand" />
    <meta property="og:description" content="Every scripture on screen, the moment it's preached. Free, open source, offline." />
    <meta property="og:image" content="./screenshot.png" />
    <link rel="icon" href="./logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      try { const t = localStorage.getItem('lampstand-theme'); document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
