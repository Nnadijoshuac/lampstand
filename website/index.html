<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lampstand: scripture on screen, as it's preached</title>
    <meta name="description" content="Free, open-source church software that listens to the sermon and puts each verse on the screen as it is preached. Runs on the church computer, on Windows." />
    <meta property="og:title" content="Lampstand" />
    <meta property="og:description" content="Scripture on screen, as it's preached. Free church software for Windows." />
    <meta property="og:image" content="https://nnadijoshuac.github.io/lampstand/worship.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      try { const t = localStorage.getItem('lampstand-theme'); document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') } catch {}
    </script>
    <script>window.goatcounter = { no_onload: true }</script>
    <script data-goatcounter="https://serenity.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
